name: Build OpenWrt firmware

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: Configuration file under openwrt/, for example sl3000.config
        required: true
        default: sl3000.config
        type: string
      update_source_code:
        description: Pull the latest source and feeds before compiling
        required: true
        default: false
        type: boolean
      apply_files:
        description: Apply files/x86 or files/filogic for the selected platform
        required: true
        default: false
        type: boolean
      release_title:
        description: GitHub Release title; leave empty to generate it automatically
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: openwrt-firmware
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ inputs.config_file }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out configurations
        uses: actions/checkout@v4

      - name: Validate configuration and resolve platform
        id: resolve
        shell: bash
        env:
          CONFIG_INPUT: ${{ inputs.config_file }}
        run: |
          set -euo pipefail

          if [[ ! "$CONFIG_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.config$ ]]; then
            echo "Invalid configuration file name: $CONFIG_INPUT" >&2
            echo "Enter only a .config file name located directly under openwrt/." >&2
            exit 1
          fi

          config_path="$GITHUB_WORKSPACE/openwrt/$CONFIG_INPUT"
          if [[ ! -f "$config_path" ]]; then
            echo "Configuration not found: openwrt/$CONFIG_INPUT" >&2
            exit 1
          fi

          is_x86=0
          is_filogic=0
          grep -qx 'CONFIG_TARGET_x86_64=y' "$config_path" && is_x86=1 || true
          grep -qx 'CONFIG_TARGET_mediatek_filogic=y' "$config_path" && is_filogic=1 || true

          if (( is_x86 + is_filogic != 1 )); then
            echo "The configuration must match exactly one supported platform: x86_64 or mediatek/filogic." >&2
            exit 1
          fi

          if (( is_x86 == 1 )); then
            platform=x86_64
          else
            platform=filogic
          fi

          config_stem="${CONFIG_INPUT%.config}"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "config_name=$CONFIG_INPUT" >> "$GITHUB_OUTPUT"
          echo "config_stem=$config_stem" >> "$GITHUB_OUTPUT"
          echo "Selected image platform: $platform"

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -hT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull base image
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/autowrt
          PLATFORM: ${{ steps.resolve.outputs.platform }}
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY:$PLATFORM"
          docker pull "$image"
          image_env="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image")"
          base_schema="$(sed -n 's/^OPENWRT_BASE_SCHEMA=//p' <<< "$image_env")"
          image_platform="$(sed -n 's/^OPENWRT_TARGET_PLATFORM=//p' <<< "$image_env")"
          if [[ "$base_schema" != "5" || "$image_platform" != "$PLATFORM" ]]; then
            echo "The base image is outdated or has the wrong platform. Run the first workflow again." >&2
            exit 1
          fi

      - name: Compile firmware in base image
        shell: bash
        env:
          CONFIG_NAME: ${{ steps.resolve.outputs.config_name }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/autowrt
          PLATFORM: ${{ steps.resolve.outputs.platform }}
          UPDATE_SOURCE_CODE: ${{ inputs.update_source_code }}
          APPLY_FILES: ${{ inputs.apply_files }}
        run: |
          set -euo pipefail
          config_path="$GITHUB_WORKSPACE/openwrt/$CONFIG_NAME"
          resources_path="$GITHUB_WORKSPACE/openwrt"
          output_dir="$RUNNER_TEMP/firmware-output"
          mkdir -p "$output_dir"

          docker run --rm \
            --env PLATFORM="$PLATFORM" \
            --env UPDATE_SOURCE_CODE="$UPDATE_SOURCE_CODE" \
            --env APPLY_FILES="$APPLY_FILES" \
            --volume "$config_path:/tmp/selected.config:ro" \
            --volume "$resources_path:/tmp/workflow-openwrt:ro" \
            --volume "$output_dir:/output" \
            "$IMAGE_REPOSITORY:$PLATFORM" \
            bash -lc '
              set -euo pipefail
              cd /workdir/openwrt

              if [[ "$UPDATE_SOURCE_CODE" == "true" ]]; then
                branch="$(git branch --show-current)"
                if [[ -z "$branch" ]]; then
                  echo "Unable to determine the source branch." >&2
                  exit 1
                fi

                git fetch --depth 1 origin "$branch"
                git reset --hard FETCH_HEAD
              fi

              if [[ "$PLATFORM" == "x86_64" ]]; then
                kernel_config=target/linux/x86/config-6.6
                if [[ ! -f "$kernel_config" ]]; then
                  echo "The x86 kernel configuration does not exist: $kernel_config" >&2
                  exit 1
                fi
                grep -qx 'CONFIG_MITIGATION_TSA=y' "$kernel_config" || \
                  printf "%s\n" "CONFIG_MITIGATION_TSA=y" >> "$kernel_config"
              fi

              chmod +x /tmp/workflow-openwrt/diy-part1.sh /tmp/workflow-openwrt/diy-part2.sh
              /tmp/workflow-openwrt/diy-part1.sh
              ./scripts/feeds update -a
              ./scripts/feeds install -a

              cp /tmp/workflow-openwrt/vermagic .vermagic
              cp /tmp/workflow-openwrt/vermagic_patch ./vermagic_patch
              /tmp/workflow-openwrt/diy-part2.sh

              rm -rf ./files
              if [[ "$APPLY_FILES" == "true" ]]; then
                case "$PLATFORM" in
                  x86_64) overlay_dir=/tmp/workflow-openwrt/files/x86 ;;
                  filogic) overlay_dir=/tmp/workflow-openwrt/files/filogic ;;
                  *)
                    echo "Unsupported platform: $PLATFORM" >&2
                    exit 1
                    ;;
                esac
                if [[ ! -d "$overlay_dir" ]]; then
                  echo "The platform files directory does not exist: $overlay_dir" >&2
                  exit 1
                fi
                mkdir -p ./files
                cp -a "$overlay_dir"/. ./files/
                rm -f ./files/.gitkeep
              fi

              cp /tmp/selected.config .config
              rm -rf bin/targets
              make defconfig
              make download -j8
              find dl -type f -size -1024c -print -delete
              make -j"$(nproc)" || make -j1 V=s

              mapfile -t firmware_dirs < <(find bin/targets -mindepth 2 -maxdepth 2 -type d)
              if (( ${#firmware_dirs[@]} == 0 )); then
                echo "No firmware output directory was produced." >&2
                exit 1
              fi

              find bin/targets -type d -name packages -prune -exec rm -rf {} +
              cp -a bin/targets/. /output/
            '

          if ! find "$output_dir" -type f -print -quit | grep -q .; then
            echo "Firmware output is empty." >&2
            exit 1
          fi

      - name: Generate artifact metadata
        id: metadata
        shell: bash
        env:
          CONFIG_NAME: ${{ steps.resolve.outputs.config_name }}
          CONFIG_STEM: ${{ steps.resolve.outputs.config_stem }}
          PLATFORM: ${{ steps.resolve.outputs.platform }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/autowrt
          UPDATE_SOURCE_CODE: ${{ inputs.update_source_code }}
          APPLY_FILES: ${{ inputs.apply_files }}
          RELEASE_TITLE_INPUT: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          file_date="$(date +'%Y%m%d%H%M%S')"
          release_tag="openwrt-${CONFIG_STEM}-${file_date}"
          if [[ "$RELEASE_TITLE_INPUT" == *$'\n'* || "$RELEASE_TITLE_INPUT" == *$'\r'* ]]; then
            echo "Release title must be a single line." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TITLE_INPUT" ]]; then
            release_title="$RELEASE_TITLE_INPUT"
          else
            release_title="OpenWrt $CONFIG_STEM $file_date"
          fi
          echo "file_date=$file_date" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          {
            echo "Configuration: openwrt/$CONFIG_NAME"
            echo "Base image: $IMAGE_REPOSITORY:$PLATFORM"
            echo "Updated source before build: $UPDATE_SOURCE_CODE"
            echo "Applied platform files: $APPLY_FILES"
            echo "Commit: $GITHUB_SHA"
          } > "$RUNNER_TEMP/release.txt"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_${{ steps.resolve.outputs.config_stem }}_${{ steps.metadata.outputs.file_date }}
          path: ${{ runner.temp }}/firmware-output
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: ${{ steps.metadata.outputs.release_title }}
          body_path: ${{ runner.temp }}/release.txt
          files: ${{ runner.temp }}/firmware-output/**/*

      - name: Show disk usage
        if: always()
        run: df -hT
